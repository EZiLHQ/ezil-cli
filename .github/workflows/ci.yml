name: EZiL CLI CI/CD

# check → staging (deploy gateway + live E2E) → production (deploy gateway + live smoke); tags v* → release binaries.
# Public repository: every job runs on GitHub-hosted runners. Self-hosted runners must never serve a public repository,
# because a fork's pull request runs the workflow file from the fork.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezil-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'

jobs:
  check:
    # Forks included: this job runs on a GitHub-hosted runner with a read-only token and no secrets.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck and test (unit, gateway, full-chain e2e, install)
        run: bun run typecheck && env -i PATH="$PATH" HOME="$HOME" CI=true bun run test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: The npm package installs and runs under Node 22 (the engines floor)
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          bash .github/scripts/build-npm.sh "$version" "$RUNNER_TEMP/npm"
          (cd "$RUNNER_TEMP/npm" && npm pack --silent >/dev/null)
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/npm/ezilhq-cli-$version.tgz" --silent
          "$RUNNER_TEMP/prefix/bin/ezil" 2>&1 | grep -q "ezil auth login"
          echo "@ezilhq/cli $version runs under $(node --version)"

  staging:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: ezil-cli-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # wrangler must run under Node: under the Bun runtime `wrangler deploy` printed its banner and exited 0
      # without deploying (secret put still worked), which only the health probe caught.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Deploy staging gateway (git-staging.ezil.work)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --env staging --var "EZIL_COMMIT:$GITHUB_SHA"
      - name: Bind the staging Worker secrets (idempotent; the API holds the same GIT_GATEWAY_SECRET)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_GATEWAY_SECRET: ${{ secrets.GIT_GATEWAY_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          printf %s "$GIT_GATEWAY_SECRET" | ./node_modules/.bin/wrangler secret put GIT_GATEWAY_SECRET --env staging
          printf %s "$IP_HASH_SALT" | ./node_modules/.bin/wrangler secret put IP_HASH_SALT --env staging
      - name: Probe staging health reports this commit, configured
        run: bash .github/scripts/probe.sh https://git-staging.ezil.work
      - name: Live E2E against real Works API and Artifacts
        env:
          EZIL_LIVE_GATEWAY: git-staging.ezil.work
          EZIL_E2E_QA_EMAIL: ${{ vars.EZIL_E2E_QA_EMAIL }}
          EZIL_E2E_QA_PASSWORD: ${{ secrets.EZIL_E2E_QA_PASSWORD }}
        run: bun tests/live/live.ts

  production:
    needs: staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: ezil-cli-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # wrangler must run under Node: under the Bun runtime `wrangler deploy` printed its banner and exited 0
      # without deploying (secret put still worked), which only the health probe caught.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Record the version production serves now (the rollback target)
        id: before
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version="$( (./node_modules/.bin/wrangler deployments list --json 2>/dev/null || echo '[]') | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let d=[];try{d=JSON.parse(s)}catch{}process.stdout.write(d.at?.(-1)?.versions?.[0]?.version_id??"")})')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Rollback target: ${version:-none (first deploy)}"
      - name: Deploy production gateway (github.ezil.work, git.ezil.work)
        id: deploy
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --var "EZIL_COMMIT:$GITHUB_SHA"
      - name: Bind the production Worker secrets (idempotent; the API holds the same GIT_GATEWAY_SECRET)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_GATEWAY_SECRET: ${{ secrets.GIT_GATEWAY_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          printf %s "$GIT_GATEWAY_SECRET" | ./node_modules/.bin/wrangler secret put GIT_GATEWAY_SECRET
          printf %s "$IP_HASH_SALT" | ./node_modules/.bin/wrangler secret put IP_HASH_SALT
      - name: Probe production health reports this commit, configured
        run: bash .github/scripts/probe.sh https://github.ezil.work
      - name: Live smoke against production
        env:
          EZIL_LIVE_GATEWAY: github.ezil.work
          EZIL_E2E_QA_EMAIL: ${{ vars.EZIL_E2E_QA_EMAIL }}
          EZIL_E2E_QA_PASSWORD: ${{ secrets.EZIL_E2E_QA_PASSWORD }}
        run: bun tests/live/live.ts
      # Only after this job's deploy succeeded and a later step (secrets, probe, smoke) failed, and only to the exact
      # version that was serving before it. A bare `wrangler rollback` targets the previous deployment, which here is
      # the secret binding of the same failing code.
      - name: Roll back to the version that was serving before this deploy
        if: failure() && steps.deploy.outcome == 'success' && steps.before.outputs.version != ''
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ steps.before.outputs.version }}
        run: |
          ./node_modules/.bin/wrangler rollback "$TARGET" --yes --message "ezil-cli $GITHUB_SHA failed after deploy"
          bash ../../.github/scripts/probe.sh https://github.ezil.work any

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build standalone binaries
        run: bash .github/scripts/build-binaries.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish the GitHub release (binaries + SHA256SUMS; notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          printf '\nInstall: `npm install -g @ezilhq/cli`, or `curl -fsSL https://github.ezil.work/install.sh | sh` (macOS, Linux), or `irm https://github.ezil.work/install.ps1 | iex` (Windows). Binaries are unsigned; verify them with SHA256SUMS.\n' >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "EZiL CLI $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Install from the live URL and run the live E2E with the installed binary
        env:
          EZIL_E2E_QA_EMAIL: ${{ vars.EZIL_E2E_QA_EMAIL }}
          EZIL_E2E_QA_PASSWORD: ${{ secrets.EZIL_E2E_QA_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 20); do [ "$(curl -fsSL https://github.ezil.work/cli/latest || true)" = "$version" ] && break; sleep 6; done
          [ "$(curl -fsSL https://github.ezil.work/cli/latest)" = "$version" ] || { echo "::error::github.ezil.work/cli/latest does not report $version"; exit 1; }
          export EZIL_INSTALL_DIR="$RUNNER_TEMP/ezil-bin"
          curl -fsSL https://github.ezil.work/install.sh | sh
          test "$("$EZIL_INSTALL_DIR/ezil" --version)" = "ezil $version"
          EZIL_LIVE_GATEWAY=github.ezil.work EZIL_CLI_BIN="$EZIL_INSTALL_DIR/ezil" bun tests/live/live.ts
      - name: Publish @ezilhq/cli to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN is not set"; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          bash .github/scripts/build-npm.sh "$version" "$RUNNER_TEMP/npm"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          if npm view "@ezilhq/cli@$version" version >/dev/null 2>&1; then echo "@ezilhq/cli@$version is already published"
          else (cd "$RUNNER_TEMP/npm" && npm publish --access public --provenance --userconfig "$RUNNER_TEMP/.npmrc"); fi
          rm -f "$RUNNER_TEMP/.npmrc"
      - name: Install @ezilhq/cli from the registry and check it runs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 20); do npm view "@ezilhq/cli@$version" version >/dev/null 2>&1 && break; sleep 6; done
          npm install -g --prefix "$RUNNER_TEMP/npm-prefix" "@ezilhq/cli@$version"
          test "$("$RUNNER_TEMP/npm-prefix/bin/ezil" --version)" = "ezil $version"
          echo "npm install -g @ezilhq/cli@$version works"
