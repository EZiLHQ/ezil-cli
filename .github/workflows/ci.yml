name: EZiL CLI CI/CD

# check → staging (deploy gateway + live E2E) → production (deploy gateway + live smoke); tags v* → release binaries.
# Runs on the private AWS runner service for this repository (label ezil-private), like ezil-work and ezil-ai-gateway.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezil-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'

jobs:
  check:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, ezil-private]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck and test (unit, gateway, full-chain e2e) under the host build lock
        run: flock --wait 1800 /var/lock/ezil-ci/build.lock bash -c 'bun run typecheck && env -i PATH="$PATH" HOME="$HOME" CI=true bun run test'

  staging:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, ezil-private]
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: ezil-cli-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # wrangler must run under Node: under the Bun runtime `wrangler deploy` printed its banner and exited 0
      # without deploying (secret put still worked), which only the health probe caught.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Deploy staging gateway (git-staging.ezil.work)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --env staging --var "EZIL_COMMIT:$GITHUB_SHA"
      - name: Bind the staging Worker secrets (idempotent; the API holds the same GIT_GATEWAY_SECRET)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_GATEWAY_SECRET: ${{ secrets.GIT_GATEWAY_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          printf %s "$GIT_GATEWAY_SECRET" | npx --no-install wrangler secret put GIT_GATEWAY_SECRET --env staging
          printf %s "$IP_HASH_SALT" | npx --no-install wrangler secret put IP_HASH_SALT --env staging
      - name: Probe staging health reports this commit, configured
        run: bash .github/scripts/probe.sh https://git-staging.ezil.work
      - name: Live E2E against real Works API and Artifacts
        env:
          EZIL_LIVE_GATEWAY: git-staging.ezil.work
          EZIL_E2E_QA_PASSWORD: ${{ secrets.EZIL_E2E_QA_PASSWORD }}
        run: bun tests/live/live.ts

  production:
    needs: staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.staging.result == 'success'
    runs-on: [self-hosted, linux, x64, ezil-private]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: ezil-cli-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # wrangler must run under Node: under the Bun runtime `wrangler deploy` printed its banner and exited 0
      # without deploying (secret put still worked), which only the health probe caught.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Deploy production gateway (github.ezil.work, git.ezil.work)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --var "EZIL_COMMIT:$GITHUB_SHA"
      - name: Bind the production Worker secrets (idempotent; the API holds the same GIT_GATEWAY_SECRET)
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_GATEWAY_SECRET: ${{ secrets.GIT_GATEWAY_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          printf %s "$GIT_GATEWAY_SECRET" | npx --no-install wrangler secret put GIT_GATEWAY_SECRET
          printf %s "$IP_HASH_SALT" | npx --no-install wrangler secret put IP_HASH_SALT
      - name: Probe production health reports this commit, configured
        run: bash .github/scripts/probe.sh https://github.ezil.work
      - name: Live smoke against production
        env:
          EZIL_LIVE_GATEWAY: github.ezil.work
          EZIL_E2E_QA_PASSWORD: ${{ secrets.EZIL_E2E_QA_PASSWORD }}
        run: bun tests/live/live.ts
      - name: Roll back the gateway if the smoke failed
        if: failure()
        working-directory: apps/git-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler rollback --yes --message "ezil-cli $GITHUB_SHA failed its live smoke"

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, ezil-private]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: bash .github/scripts/build-binaries.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "EZiL CLI $GITHUB_REF_NAME" --notes "Unsigned binaries; verify with SHA256SUMS."
